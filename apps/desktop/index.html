<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>OneTHU</title>
<!-- Google Fonts 已移除：国内被墙且为渲染阻塞资源，是手机端刷新极慢的元凶；CSS 字体栈从未使用它 -->
  </head>
  <body>
    <!-- 液态玻璃折射滤镜（全站共享，一次定义）。
         被 CSS 的 backdrop-filter: url(#dsh-liquid-refract) 引用；仅 Chromium 生效，
         WebKit/Gecko 忽略该值，自动落到 backdrop-filter 的模糊回退（见 global.css 的 glass 档）。
         位移图是一张由 feTurbulence 生成的低频噪声，scale 决定折射强度（档位可调）。 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <filter id="dsh-liquid-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="7" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="1.5" result="soft" />
          <feDisplacementMap in="SourceGraphic" in2="soft" scale="12" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
