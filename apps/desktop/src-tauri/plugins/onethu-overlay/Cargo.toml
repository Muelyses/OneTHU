[package]
name = "tauri-plugin-onethu-overlay"
version = "0.1.0"
edition = "2021"
description = "OneTHU 全局悬浮球：Android 系统级悬浮层（SYSTEM_ALERT_WINDOW + 前台服务 + WindowManager）"
links = "tauri-plugin-onethu-overlay"

[lib]
name = "tauri_plugin_onethu_overlay"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
log = "0.4"
