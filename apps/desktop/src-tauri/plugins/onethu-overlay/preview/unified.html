<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0} body{font-family:-apple-system,"PingFang SC",sans-serif}
.bg{width:100%;height:100%;padding:16px;display:flex;gap:16px;background:linear-gradient(120deg,#7d8b98 0%,#c4ced6 42%,#23282e 43%,#0b0e11 100%)}
.panel{width:333px;border-radius:24px;padding:10px 14px 14px;display:flex;flex-direction:column;gap:11px;
 background:rgba(255,255,255,.90);border:1px solid rgba(0,0,0,.14);box-shadow:0 14px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.5)}
.panel.dark{background:rgba(0,0,0,.80);border-color:rgba(255,255,255,.19);color:#ECECF1;box-shadow:0 16px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)}
.handle{width:36px;height:5px;border-radius:3px;background:rgba(28,31,36,.35);margin:0 auto 8px}
.panel.dark .handle{background:rgba(236,236,241,.35)}
.chips{display:flex;gap:8px}
.chip{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;font-size:12px;white-space:nowrap;
 background:rgba(255,255,255,.86);color:#1C1F24;border:1px solid rgba(0,0,0,.12)}
.panel.dark .chip{background:rgba(0,0,0,.45);color:#ECECF1;border-color:rgba(255,255,255,.2)}
.bub{max-width:84%;padding:7px 13px;font-size:15px;line-height:1.55;border-radius:20px 20px 20px 6px;color:#1C1F24;
 background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.48));border:1px solid rgba(255,255,255,.35);
 box-shadow:0 10px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.bub.user{align-self:flex-end;border-radius:20px 20px 6px 20px}
.panel.dark .bub{color:#ECECF1;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.30));border-color:rgba(255,255,255,.22)}
.iconrow{display:flex;align-items:center;gap:10px}
.vbar{border-radius:18px;padding:6px 16px 8px;background:rgba(255,255,255,.90);border:1px solid rgba(0,0,0,.14);
 box-shadow:0 12px 22px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5)}
.vbar.dark{background:rgba(0,0,0,.80);border-color:rgba(255,255,255,.19);color:#ECECF1}
.subband{border-radius:14px;padding:6px 12px;font-size:15px;margin-bottom:6px;background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.14)}
.vbar.dark .subband{background:rgba(0,0,0,.68);border-color:rgba(255,255,255,.19);color:#ECECF1}
.cap{font:11px/1.5 "SF Mono",Menlo,monospace;color:#ffe9a8;margin-bottom:6px}
