[package]
name = "tauri-plugin-onethu-tts"
version = "0.1.0"
edition = "2021"
description = "OneTHU 语音合成：Android 系统 TextToSpeech（音色/音高/语速真实生效，零下载）"
links = "tauri-plugin-onethu-tts"

[lib]
name = "tauri_plugin_onethu_tts"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
log = "0.4"
